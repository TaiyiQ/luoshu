# arch.toml

# Neutral Atom Layout Architecture

# ── Platform identity ──────────────────────────────────────────
[platform]
name = "taiyi-v1"
version = "0.1"

# ── Single AOD array ───────────────────────────────────────────
# One AOD is sufficient for MVP — add aod_id = 1 later for
# parallel shuttling across multiple compute zones.
[aod]
aod_id = 0
min_sep_um = 1.5 # minimum row-to-row and col-to-col separation; the pickup
                 # choreography packs columns down to half the storage trap
                 # spacing (3.0 / 2), so it must not exceed that
max_num_row = 7  # physical limit of your AOD row component
max_num_col = 100 # physical limit of your AOD column component

# ── Storage zone ───────────────────────────────────────────────
# One rectangular SLM grid where idle qubits live
# Rydberg laser does NOT illuminate this region.
[storage_zone]
zone_id = 0
offset_um = [0.0, 0.0]       # bottom-left corner (x, y)
dimension_um = [330.0, 30.0] # width x height: covers the 100x10 trap grid (297x27um)

[storage_zone.slm]
slm_id = 0
num_row = 10
num_col = 110
sep_um = [3.0, 3.0]    # trap spacing (x, y)
offset_um = [0.0, 0.0] # relative to storage_zone.offset_um

# ── Compute zone ───────────────────────────────────────────────
# Where Rydberg laser fires. Atoms must be shuttled here for 2Q gates.
# Two SLM arrays define Rydberg sites (pairs of traps separated by
# dRyd). Engineer sets these from laser spot size measurements.
[compute_zone]
zone_id = 1
offset_um = [0.0, 50.0]
dimension_um = [1100.0, 110.0] # covers the 100x10, 12um-pitch slm 1 grid (990x108um)
dr_um = 2.0                  # trap separation within a Rydberg site (laser spot size)
dw_um = 10.0                 # site-to-site separation (must exceed blockade radius)

# Each Rydberg site = one trap from slm_a + one trap from slm_b,
# paired along x, separated by dRyd = slm_b.offset - slm_a.offset.
# dRyd = 2um here (37 - 35 = 2).
# Site-to-site spacing dω = 10um (sep_um values below).
[[compute_zone.slms]]
slm_id = 1
num_row = 10
num_col = 110
sep_um = [10.0, 12.0]   # [dr_um + dw_um, dw_um]
offset_um = [0.0, 0.0] # relative to entangle_zone.offset_um

[[compute_zone.slms]]
slm_id = 2
num_row = 7
num_col = 10
sep_um = [10.0, 12.0]
offset_um = [0.0, 2.0]

# ── Readout zone ───────────────────────────────────────────────
# Where atoms are imaged. One SLM row of measurement traps — the
# compiler shuttles atoms here and parks them for imaging.
[readout_zone]
zone_id = 2
offset_um = [0.0, 165.0] # compute zone now tops out at y=160; keep dz_um clearance
dimension_um = [240.0, 10.0]

[readout_zone.slm]
slm_id = 3
num_row = 1
num_col = 20
sep_um = [4.0, 4.0]    # imaging spot spacing; >= aod.min_sep_um
offset_um = [0.0, 0.0] # relative to readout_zone.offset_um

# ── Physical constraints ───────────────────────────────────────
# Compiler uses these to validate shuttles and estimate timing.
[constraints]
db_um = 3.0 # Rydberg interaction range (blockage radius)
dz_um = 3.0 # min gap between zones (avoid stray excitation)

# Gate and readout fidelity
one_qubit_gate_fidelity = 0.999
two_qubit_gate_fidelity = 0.995
readout_fidelity = 0.990
